name: Premium V3 Auto Factory

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic filename without .json, or auto"
        required: true
        default: "auto"

  schedule:
    # Her gün Türkiye saatiyle yaklaşık 12:00
    - cron: "0 9 * * *"

permissions:
  contents: read

concurrency:
  group: lost-worlds-auto-factory
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Kokoro
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-v1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "kokoro>=0.9.4" soundfile edge-tts numpy

      - name: Select topic
        id: select
        env:
          REQUESTED_TOPIC: ${{ github.event.inputs.topic || 'auto' }}
        run: |
          python auto_select.py "$REQUESTED_TOPIC"
          VIDEO="$(cat selected_topic.txt)"
          echo "video=$VIDEO" >> "$GITHUB_OUTPUT"
          echo "Selected video: $VIDEO"

      - name: Validate selected topic
        run: |
          test -f "${{ steps.select.outputs.video }}.json"

      - name: Render Premium Video
        env:
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
        run: |
          python factory.py "${{ steps.select.outputs.video }}.json"

      - name: Create production manifest
        if: success()
        run: |
          mkdir -p output
          {
            echo "V3 Premium Auto Factory"
            echo "Topic: ${{ steps.select.outputs.video }}"
            echo "Run: ${{ github.run_number }}"
            echo "Commit: ${{ github.sha }}"
            echo "UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > output/production_manifest.txt

      - name: Upload Premium Video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.select.outputs.video || 'failed' }}-premium-v3
          path: output/
          if-no-files-found: warn
          retention-days: 30
