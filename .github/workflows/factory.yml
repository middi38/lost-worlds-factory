name: Video Factory

on:
  workflow_dispatch:
    inputs:
      video:
        description: "Video dosyasinin adi (.json olmadan)"
        required: true
        default: "pompeii"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Araclari kur
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install edge-tts
      - name: Videoyu uret
        env:
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
        run: python factory.py "${{ inputs.video }}.json"
      - name: Videoyu teslim et
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.video }}-video
          path: output/
