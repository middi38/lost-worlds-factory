name: Premium Video Factory

on:
  workflow_dispatch:
    inputs:
      video:
        description: "JSON filename without .json"
        required: true
        default: "doggerland"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Kokoro
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-v1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "kokoro>=0.9.4" soundfile edge-tts numpy

      - name: Validate video specification
        run: |
          test -f "${{ inputs.video }}.json"

      - name: Render Premium Video
        env:
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
        run: |
          python factory.py "${{ inputs.video }}.json"

      - name: Upload Premium Video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.video }}-premium-video
          path: output/
          if-no-files-found: warn
