name: Premium V4 Auto Factory

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic slug or auto"
        required: true
        default: "auto"

  schedule:
    # Her gün Türkiye saatiyle 12:00
    - cron: "0 9 * * *"

permissions:
  contents: write

concurrency:
  group: lost-worlds-v4
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Kokoro
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-v1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "kokoro>=0.9.4" soundfile edge-tts numpy

      - name: Select topic
        id: select
        env:
          REQUESTED_TOPIC: ${{ github.event.inputs.topic || 'auto' }}
        run: |
          python auto_select.py "$REQUESTED_TOPIC"
          VIDEO="$(cat selected_topic.txt)"
          echo "video=$VIDEO" >> "$GITHUB_OUTPUT"
          echo "Selected topic: $VIDEO"

      - name: Validate selected topic
        run: |
          test -f "${{ steps.select.outputs.video }}.json"

      - name: Render Premium Video
        env:
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
        run: |
          python factory.py "${{ steps.select.outputs.video }}.json"

      - name: Create production manifest
        if: success()
        run: |
          mkdir -p output
          {
            echo "Premium V4 Auto Factory"
            echo "Topic: ${{ steps.select.outputs.video }}"
            echo "Run: ${{ github.run_number }}"
            echo "Commit: ${{ github.sha }}"
            echo "UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > output/production_manifest.txt

      - name: Upload Premium Video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.select.outputs.video || 'failed' }}-premium-v4
          path: output/
          if-no-files-found: warn
          retention-days: 30

      - name: Mark topic as used
        if: success()
        env:
          VIDEO: ${{ steps.select.outputs.video }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("used_topics.json")

          try:
              data = json.loads(path.read_text(encoding="utf-8")) if path.exists() else []
          except Exception:
              data = []

          if not isinstance(data, list):
              data = []

          video = os.environ["VIDEO"]

          existing = {str(item).strip().lower() for item in data}

          if video.lower() not in existing:
              data.append(video)

          path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          git config user.name "lost-worlds-bot"
          git config user.email "actions@users.noreply.github.com"

          git add used_topics.json

          git diff --cached --quiet || \
            git commit -m "Mark $VIDEO as produced [skip ci]"

          git push
